[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aipd-os"
version = "5.4.0"
description = "AIPD-OS v5.4 - AI 产品工程决策操作系统（AI Product/Program Decision OS）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AIPD-OS Team" }]
keywords = ["aipd", "engineering", "decision", "os", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
server = [
    "cryptography>=3.4",
]
full = [
    "pillow",
    "reportlab",
    "requests",
    "pyyaml",
]
# mcp 要求 Python >=3.10，与项目 requires-python >=3.9 冲突；
# 单独置于独立 extra，避免破坏 Python 3.9 的干净安装。
server-mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
aipd = "aipd_os.cli.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: 集成测试（需要外部服务/长耗时）",
    "model_eval: 需要真实模型/外部端点（CI 默认用 `pytest -m \"not model_eval\"` 跳过）",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.9"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
[tool.setuptools.package-data]
aipd_os = ["py.typed"]
