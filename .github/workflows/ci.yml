name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[full,dev]"
      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[full,dev]"
      - name: Run integration tests
        run: python -m pytest tests/ -m integration -q
      - name: Run integration smoke (real end-to-end chains)
        run: python -m pytest tests/test_integration_smoke.py -q

  schema-validation:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
      - name: Validate JSON schemas
        run: python -m aipd_os.scripts.schema_check

  maturity-consistency:
    name: Maturity consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Run maturity consistency tests
        run: python -m pytest tests/maturity_consistency_test.py -q

  cad-golden-loop:
    name: CAD golden loop (real kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (with real CadQuery kernel via cad extra)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[cad,dev]"
      - name: Verify real CadQuery/OpenCASCADE kernel
        run: python -c "import cadquery as cq; print('cadquery', cq.__version__)"
      # Commit 8B：CAD 两套测试都跑（golden-loop + contract unify）。
      # 纯 contract 测试（validate_param/ContractBackend）任何环境都必须运行，
      # 而不再因无 CadQuery 而整模块跳过。
      - name: Run CAD golden-closure + contract tests (real B-Rep kernel required)
        run: python -m pytest tests/test_cad_golden_loop.py tests/test_cad_contract_unify.py -q

  # Commit 8C：Python 版本契约。pyproject 声明 requires-python=">=3.9"
  # （验证矩阵 3.9-3.12），此处显式跑核心套件矩阵，避免「宣称 >=3.9 却只验证 3.9」。
  # CAD 真实内核（cad-golden-loop）单独在 3.9 验证（标注：CAD 只在 3.9 验证）。
  python-core-matrix:
    name: Python core matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[full,dev]"
      - name: Run core test suite (no model_eval / integration / CAD kernel)
        run: python -m pytest tests/ -m "not model_eval and not integration" -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/zricethezav/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose

  # 本地硬基线（ruff 0 / mypy 0）此前在 CI 不设防；补 lint job 使之成为门禁。
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[full,dev]"
      - name: Run ruff
        run: ruff check src tests state_service
      - name: Run mypy
        run: mypy

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[full,dev]"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit (acknowledged CVEs documented in docs/security/dependency-cve-review.md)
        run: python scripts/audit_dependency_ack.py

  license-scan:
    name: License scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[full,dev]"
      - name: Install pip-licenses
        run: pip install pip-licenses
      - name: Run pip-licenses
        run: pip-licenses

  package-build:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install build
      - name: Build package
        run: python -m build


  audit:
    name: Version truth audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Run repo audit
        run: python scripts/audit_repo.py --json-out docs/audit/audit.json
      - name: Generate capability matrix audit deliverables
        run: python scripts/capability_matrix.py --repo . --out docs/audit
      - name: Run audit tests
        run: python -m pytest tests/test_audit_repo.py tests/test_capability_matrix.py -q

  skill-quality-and-coverage:
    name: Skill quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[full,dev]"
      - name: Run skill quality audit
        run: python scripts/skill_quality_audit.py
      - name: Run command coverage and capability matrix tests
        run: python -m pytest tests/test_command_coverage.py tests/test_capability_matrix.py -q

  # 发布门禁：仅当所有 CI job 成功后才生成正式发布产物。
  # 该 job 复核测试套件与发布清单有效性，通过后才允许触发正式发布流水线。
  release-ready:
    name: Release ready gate
    needs:
      - unit
      - integration
      - schema-validation
      - maturity-consistency
      - cad-golden-loop
      # v5.8.1 Commit 13：Python 3.12 核心矩阵失败也必须阻止发布
      # （§42：不能「宣称 >=3.9 却只验证 3.9」）
      - python-core-matrix
      - secret-scan
      - dependency-audit
      - license-scan
      - package-build
      - audit
      - skill-quality-and-coverage
      - lint
    # 明确注释：本 job 不降级任何既有 job 的失败语义；任一上游失败都会阻止发布。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[full,dev]"
      - name: Run full test suite (excluding external-capability integration)
        run: python -m pytest tests/ -m "not model_eval" -q
      - name: Validate release manifest consistency
        run: python -m pytest tests/test_packaging.py -q
      - name: Verify version truth
        run: python scripts/audit_repo.py
